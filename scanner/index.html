<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treeline — Prompt Scanner</title>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/home.css">
</head>
<body>
  <header class="nav">
    <div class="container nav__inner">
      <a class="brand" href="/"><img class="brand__mark" src="/assets/treeline-mark.svg" alt="Treeline" /><span class="brand__text">Treeline</span></a>
      <nav class="nav__links">
        <a href="/sidecar/">Sidecar</a>
        <a href="/scanner/">Scanner</a>
        <a href="/builder/">Prompt&nbsp;Builder</a>
        <a href="/resources/sidecar/">Docs</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero"><h1>Prompt Scanner</h1><p class="lead">Local scan & redaction. No data leaves your browser.</p></section>
    <article class="card">
      <div class="card__body">
        <textarea id="scan-input" class="input" rows="12" placeholder="Paste text or a prompt here…"></textarea>
        <div class="actions">
          <button id="scan-btn" class="btn btn--primary">Scan</button>
          <button id="redact-btn" class="btn">Redact</button>
          <button id="copy-redacted" class="btn btn--ghost">Copy redacted</button>
        </div>
        <div id="scan-results" class="results"></div>
      </div>
    </article>
  </main>
  <script src="/assets/scanner.js"></script>
</body>
</html>
