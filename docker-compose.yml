networks:
  treeline:
    driver: bridge

services:
  mitmproxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.mitm
    image: treeline/mitm:4.1.3
    environment:
      - RULES_FILE=/addons/rules.json
      - RELOAD_SECONDS=5
      - METRICS_PORT=9090
    ports:
      - "127.0.0.1:8081:8081"   # mitm Web UI (dev-only)
      - "127.0.0.1:9090:9090"   # addon metrics/health
    volumes:
      - ./mitm/addons:/addons:ro
      # - ~/.mitmproxy:/home/mitmproxy/.mitmproxy    # uncomment to persist CA certs (optional)
    restart: unless-stopped
    stop_grace_period: 15s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [treeline]

  envoy:
    build:
      context: .
      dockerfile: docker/Dockerfile.envoy
    image: treeline/envoy:4.1.4
    ports:
      - "127.0.0.1:15000:15000" # proxy
      - "127.0.0.1:19901:19901" # admin/ready
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      mitmproxy:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [treeline]
