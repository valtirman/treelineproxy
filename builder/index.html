<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treeline — Prompt Builder</title>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/home.css">
</head>
<body>
  <header class="nav">
    <div class="container nav__inner">
      <a class="brand" href="/"><img class="brand__mark" src="/assets/treeline-mark.svg" alt="Treeline" /><span class="brand__text">Treeline</span></a>
      <nav class="nav__links">
        <a href="/sidecar/">Sidecar</a>
        <a href="/scanner/">Scanner</a>
        <a href="/builder/">Prompt&nbsp;Builder</a>
        <a href="/resources/sidecar/">Docs</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero"><h1>Prompt Builder</h1><p class="lead">Compose production‑ready prompts with structure and constraints.</p></section>
    <article class="card">
      <div class="card__body builder">
        <label>Role <input id="b-role" class="input" placeholder="e.g., Senior Data Engineer" /></label>
        <label>Task <input id="b-task" class="input" placeholder="e.g., design a Spark job to de‑duplicate records" /></label>
        <label>Data / Context <input id="b-data" class="input" placeholder="e.g., Parquet on S3, 200GB/day, Glue catalog" /></label>
        <div class="grid two tight">
          <label>Output format
            <select id="b-format" class="input">
              <option>bullet list</option><option>step‑by‑step plan</option><option>RFC with headers</option><option>code with comments</option>
            </select>
          </label>
          <label>Tone
            <select id="b-tone" class="input">
              <option>concise</option><option>formal</option><option>friendly</option><option>critical</option>
            </select>
          </label>
        </div>
        <label>Constraints <input id="b-constraints" class="input" placeholder="e.g., cite sources, include risks, stay under 400 words" /></label>
        <div class="actions"><button id="build-btn" class="btn btn--primary">Build Prompt</button><button id="copy-built" class="btn btn--ghost">Copy</button></div>
        <textarea id="built-output" class="output" rows="12" placeholder="Your generated prompt will appear here…" readonly></textarea>
      </div>
    </article>
  </main>
  <script src="/assets/builder.js"></script>
</body>
</html>
