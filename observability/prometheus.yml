global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Envoy admin -> built-ins (rq counts, latencies, clusters)
  - job_name: envoy
    metrics_path: /stats
    params:
      format: [prometheus]
      usedonly: ['true']
    static_configs:
    - targets: ['localhost:19901']

  # Treeline scanner -> decisions (your counters on :9090)
  - job_name: treeline_scanner
    metrics_path: /metrics
    static_configs:
    - targets: ['localhost:9090']

