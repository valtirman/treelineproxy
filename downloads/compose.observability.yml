
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: treeline-prom
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=15d"]
    ports: ["127.0.0.1:9091:9090"]
    volumes: ["./downloads/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on:
      treeline-sidecar:
        condition: service_healthy
  grafana:
    image: grafana/grafana-oss:latest
    container_name: treeline-grafana
    ports: ["127.0.0.1:3030:3000"]
    environment: ["GF_SECURITY_ADMIN_PASSWORD=admin"]
    depends_on: ["prometheus"]
