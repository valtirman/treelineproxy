
services:
  treeline:
    image: ghcr.io/treelineproxy/sidecar:latest
    container_name: treeline-sidecar
    ports:
      - "127.0.0.1:15050:15000"
      - "127.0.0.1:9096:9095"
      - "127.0.0.1:18080:8080"
    environment:
      - TREELINE_RULEPACK=/app/rules/baseline.yaml
      - TREELINE_FAIL_MODE=soft
      - TREELINE_DECISION_HEADERS=false
    volumes:
      - ./rules:/app/rules:ro
      - ./mitm:/home/mitmproxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
