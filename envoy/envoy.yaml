# envoy/envoy.yaml — v4 drop-in (Lua counters + probe, CONNECT enabled)
static_resources:
  listeners:
  - name: forward_proxy_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 15000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: forward_proxy
          use_remote_address: true
          normalize_path: true
          common_http_protocol_options:
            headers_with_underscores_action: REJECT_REQUEST
          http_protocol_options:
            allow_absolute_url: true
          # Enable both CONNECT and WebSocket upgrades
          upgrade_configs:
          - upgrade_type: CONNECT
          - upgrade_type: websocket

          route_config:
            name: forward_proxy_routes
            virtual_hosts:
            - name: any_host
              domains: ["*"]
              routes:
                # Tunnel TLS via upstream proxy
                - match: { connect_matcher: {} }
                  route: { cluster: mitm }
                # Regular HTTP goes to upstream proxy
                - match: { prefix: "/" }
                  route: { cluster: mitm }

          # --- Treeline Lua metrics (inserted above router) ---
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              inline_code: |
                -- Add a probe header so we can confirm Lua executed
                -- and export Treeline decision counters via Envoy stats.
                local function sanitize(s)
                  if not s or s == "" then return "unspecified" end
                  s = string.lower(s):gsub("[^%w_]+","_")
                  if #s > 64 then s = string.sub(s, 1, 64) end
                  return s
                end

                function envoy_on_response(handle)
                  -- PROBE: visible on plain HTTP responses from httpbin etc.

                  local h = handle:headers()
                  local status = tonumber(h:get(":status") or "0")
                  local act = (h:get("X-Treeline-Action") or ""):lower()
                  local reason = sanitize(h:get("X-Treeline-Reason"))

                  if status == 451 or act == "blocked" or act == "block" then
                    handle:counter("treeline_block_total"):inc(1)
                    handle:counter("treeline_block_total_reason_" .. reason):inc(1)
                    return
                  end

                  if act == "redact" or act == "redacted" then
                    handle:counter("treeline_redact_total"):inc(1)
                    return
                  end

                  if act == "observe" then
                    handle:counter("treeline_observe_total"):inc(1)
                    return
                  end

                  handle:counter("treeline_allow_total"):inc(1)
                end
          # Router stays LAST
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: mitm
    type: STRICT_DNS
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: mitm
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: mitmproxy     # <— change if your service name differs
                port_value: 8080       # <— change if your mitm proxy port differs
    upstream_connection_options:
      tcp_keepalive: {}
    health_checks:
    - timeout: 1s
      interval: 2s
      unhealthy_threshold: 2
      healthy_threshold: 2
      tcp_health_check: {}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 19901

