static_resources:
  listeners:
  - name: tcp_forward_to_mitm
    address: { socket_address: { address: 0.0.0.0, port_value: 15000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: treeline_tcp
          cluster: mitm

  clusters:
  - name: mitm
    type: STRICT_DNS
    connect_timeout: 2s
    dns_lookup_family: V4_ONLY

    # NEW: active health check to mitmproxy:8080
    health_checks:
    - timeout: 1s
      interval: 5s
      unhealthy_threshold: 2
      healthy_threshold: 1
      tcp_health_check: {}  # plain TCP works for CONNECT proxy

    # NEW: circuit breakers & outlier detection (protective)
    circuit_breakers:
      thresholds:
        max_connections: 2000
        max_pending_requests: 1000
        max_requests: 5000
    outlier_detection:
      consecutive_5xx: 5
      interval: 5s
      base_ejection_time: 30s

    load_assignment:
      cluster_name: mitm
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: mitmproxy, port_value: 8080 } }

admin:
  access_log_path: /tmp/admin_access.log
  address: { socket_address: { address: 0.0.0.0, port_value: 19901 } }

